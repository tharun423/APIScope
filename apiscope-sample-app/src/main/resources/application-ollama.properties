# ── Python LLM Service ────────────────────────────────────────────────────────
# The Python FastAPI service handles Ollama chat + embeddings + vector search.
#
# HOW TO START:
#   cd llm-service
#   pip install -r requirements.txt
#   uvicorn main:app --port 8000
#
# ENVIRONMENT VARIABLES (optional overrides inside the Python service):
#   CHAT_MODEL=llama3.2          (default)
#   EMBED_MODEL=nomic-embed-text (default)
#   TEMPERATURE=0.1              (default)
#
# OLLAMA MODELS (one-time pull):
#   ollama pull llama3.2
#   ollama pull nomic-embed-text
# ─────────────────────────────────────────────────────────────────────────────
apiscope.llm-service-url=http://localhost:8000
